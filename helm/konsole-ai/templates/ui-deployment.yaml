apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konsole-ai.fullname" . }}-ui
  labels:
    {{- include "konsole-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.ui.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "konsole-ai.selectorLabels" (dict "root" $ "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "konsole-ai.selectorLabels" (dict "root" $ "component" "ui") | nindent 8 }}
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://{{ include "konsole-ai.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: API_KEY
              value: {{ .Values.ui.apiKey | quote }}
