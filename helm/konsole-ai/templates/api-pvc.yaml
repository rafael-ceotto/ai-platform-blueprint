apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "konsole-ai.fullname" . }}-api
  labels:
    {{- include "konsole-ai.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.api.persistence.storageClassName }}
  storageClassName: {{ .Values.api.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
