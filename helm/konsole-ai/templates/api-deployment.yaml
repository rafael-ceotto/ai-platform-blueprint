apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "konsole-ai.fullname" . }}-api
  labels:
    {{- include "konsole-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Hardcoded, not templated for scaling -- see the comment on
  # api.replicaCount in values.yaml for why this chart has no api HPA.
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "konsole-ai.selectorLabels" (dict "root" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "konsole-ai.selectorLabels" (dict "root" $ "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "konsole-ai.fullname" . }}-api
          env:
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "konsole-ai.fullname" . }}-api
                  key: API_KEYS
          livenessProbe:
            httpGet:
              path: {{ .Values.api.env.API_V1_PREFIX }}/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.api.env.API_V1_PREFIX }}/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "konsole-ai.fullname" . }}-api
