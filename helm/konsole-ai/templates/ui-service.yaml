apiVersion: v1
kind: Service
metadata:
  name: {{ include "konsole-ai.fullname" . }}-ui
  labels:
    {{- include "konsole-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
  selector:
    {{- include "konsole-ai.selectorLabels" (dict "root" $ "component" "ui") | nindent 4 }}
