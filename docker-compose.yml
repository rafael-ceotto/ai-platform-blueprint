name: konsole-ai

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: konsole-ai-api:local
    container_name: konsole-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: "Konsole.ai"
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      API_V1_PREFIX: /api/v1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      TRACING_ENABLED: "true"
      METRICS_ENABLED: "true"
      OTEL_SERVICE_NAME: "konsole-ai-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./backend:/app/backend:ro
      - ./ingestion:/app/ingestion:ro
      - ./retrieval:/app/retrieval:ro
      - ./llm:/app/llm:ro
      - ./observability:/app/observability:ro
      - api_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform

  ollama:
    image: ollama/ollama:latest
    container_name: konsole-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform
    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: konsole-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    networks:
      - platform

  prometheus:
    image: prom/prometheus:latest
    container_name: konsole-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - platform

  grafana:
    image: grafana/grafana:latest
    container_name: konsole-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - platform

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: konsole-ai-ui:local
    container_name: konsole-ui
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: dev-local-key
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  ollama_data:
  api_data:
