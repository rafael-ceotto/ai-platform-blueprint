name: ai-platform-blueprint

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-platform-blueprint-api:local
    container_name: ai-platform-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_NAME: "AI Platform Blueprint"
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      API_V1_PREFIX: /api/v1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ./backend:/app/backend:ro
      - ./ingestion:/app/ingestion:ro
      - ./retrieval:/app/retrieval:ro
      - ./llm:/app/llm:ro
      - ./observability:/app/observability:ro
      - api_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - platform

  ollama:
    image: ollama/ollama:latest
    container_name: ai-platform-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform
    # Uncomment to enable GPU acceleration (requires nvidia-container-toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  platform:
    driver: bridge

volumes:
  ollama_data:
  api_data:
