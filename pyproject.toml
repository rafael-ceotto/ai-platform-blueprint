[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "konsole-ai"
version = "0.1.0"
description = "Konsole.ai — a local-first AI/LLM platform: FastAPI, Ollama, and vector search, designed to scale from prototype to production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafael Ceotto" }]
keywords = ["ai", "llm", "fastapi", "rag", "ollama", "vector-search", "konsole-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "pypdf>=4.0.0",
  "beautifulsoup4>=4.12.0",
  "python-multipart>=0.0.9",
  "rank-bm25>=0.2.2",
  "langchain-classic>=1.0.0",
  "langgraph>=0.2.0",
  "prometheus-fastapi-instrumentator>=7.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
]
# ui/ has its own requirements.txt for the Docker image (ADR-0010) --
# this extra exists only so `tests/test_ui_app.py` can import streamlit
# locally and in CI. Keep versions in sync with ui/requirements.txt.
ui = [
  "streamlit>=1.61.0",
  "httpx2>=2.10.0",
]
# mcp_server/ is never deployed/containerized (it's a stdio subprocess
# spawned locally by an MCP client, e.g. Claude Desktop) -- confirmed via
# `pip check` to not conflict with fastapi/starlette/httpx/pydantic, so
# it's a plain extra here rather than ui/-style full isolation. See
# docs/adr/0016-mcp-server-support.md.
mcp = [
  "mcp[cli]>=2.0.0",
]

[project.scripts]
konsole-mcp-server = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ingestion", "retrieval", "llm", "observability", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ingestion", "retrieval", "llm", "observability", "mcp_server"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "faiss"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=backend --cov=ingestion --cov=retrieval --cov=llm --cov=observability --cov=mcp_server --cov-report=term-missing"

[tool.coverage.run]
source = ["backend", "ingestion", "retrieval", "llm", "observability", "mcp_server"]
omit = ["tests/*"]
