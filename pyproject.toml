[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-platform-blueprint"
version = "0.1.0"
description = "Production-grade blueprint for building AI/LLM platforms — FastAPI, local-first LLM runtime (Ollama), and vector search, designed to scale from prototype to production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafael Ceotto" }]
keywords = ["ai", "llm", "fastapi", "rag", "ollama", "vector-search", "platform-blueprint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.2.0",
  "pypdf>=4.0.0",
  "beautifulsoup4>=4.12.0",
  "python-multipart>=0.0.9",
  "rank-bm25>=0.2.2",
  "langchain-classic>=1.0.0",
  "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ingestion", "retrieval", "llm", "observability"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ingestion", "retrieval", "llm", "observability"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "faiss"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=backend --cov=ingestion --cov=retrieval --cov=llm --cov=observability --cov-report=term-missing"

[tool.coverage.run]
source = ["backend", "ingestion", "retrieval", "llm", "observability"]
omit = ["tests/*"]
